<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Дорога домой · Дифференциация Р–Л</title>
<style>
:root{font-family:"Trebuchet MS",system-ui,sans-serif;color:#233b2d;background:#b9d88c;color-scheme:light}
*{box-sizing:border-box}body{margin:0;overflow:hidden}main{position:relative;width:100%;height:100vh;height:100dvh;overflow:hidden;isolation:isolate}
canvas{display:block;width:100%;height:100%;background:#bdd994}
button{font:inherit;cursor:pointer;border:0;color:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible{outline:3px solid #243952;outline-offset:5px}button:active{transform:translateY(2px)}
[hidden]{display:none!important}
.hud{position:absolute;inset:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) auto max(16px,env(safe-area-inset-left));display:flex;justify-content:space-between;align-items:start;pointer-events:none}
.badge{background:#fff9e9;border:2px solid #fffcf4;border-radius:17px;box-shadow:0 4px 0 #2d4d3238,0 7px 20px #263e2626;padding:8px 13px;font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
#letter{background:#fbdb78;min-width:45px;text-align:center}
.panel{position:absolute;bottom:max(22px,env(safe-area-inset-bottom));left:50%;translate:-50% 0;display:flex;align-items:center;gap:14px;white-space:nowrap}
#start,#finish{flex-direction:column;gap:12px;background:#fff9e9;padding:15px 20px 19px;border:2px solid #fffdf5;border-radius:24px;box-shadow:0 5px 0 #30472744,0 10px 38px #253f333d}
#start p,#finish p{margin:0;font-size:clamp(17px,3.5vw,22px);font-weight:800}
.mode-row{display:flex;gap:12px}.action{display:grid;place-items:center;min-width:67px;min-height:60px;border:2px solid #ffffffab;border-radius:17px;background:#ffda73;box-shadow:0 4px 0 #aa782e,0 7px 19px #253e3655;font-weight:900;font-size:32px}
.mode-row button+button,.action.right{background:#c7e4fa;box-shadow:0 4px 0 #648eab,0 7px 19px #253e3655}
#turns{gap:clamp(18px,8vw,72px)}#turns .action{width:clamp(73px,13vw,112px);height:clamp(55px,8vw,64px)}
#turns button:disabled{opacity:.48;cursor:default;transform:none}
#undo{font-size:28px;width:62px;min-width:62px;min-height:54px}
#finish button{font-size:17px;padding:0 15px;min-height:47px}
.card{position:absolute;display:grid;place-items:center;pointer-events:none;width:clamp(78px,21vw,158px);aspect-ratio:1;background:#fffefa;border:3px solid #e1ac51;border-radius:21%;box-shadow:0 5px 0 #26432d48,0 9px 18px #26432d33;translate:-50% -50%;scale:.93;opacity:0;transition:opacity .23s,scale .23s}
.card.right{border-color:#88b1cc}.card.on{opacity:1;scale:1}
.card::after{content:"";position:absolute;width:14%;aspect-ratio:1;rotate:45deg;background:#fffefa;top:65%;right:-8%;border-top:3px solid #e1ac51;border-right:3px solid #e1ac51;z-index:-1;border-radius:2px}
.card.right::after{right:auto;left:-8%;border:0;border-left:3px solid #88b1cc;border-bottom:3px solid #88b1cc}
.card canvas{width:100%;height:100%;background:transparent}
@media(max-height:430px){.panel{bottom:10px}.card{width:clamp(65px,23vh,108px)}#turns .action{height:46px;min-height:46px}#start,#finish{padding:8px 14px 12px;gap:6px}}
</style>
</head>
<body>
<main aria-label="Дорога домой. Дифференциация Р–Л">
<canvas id="world" aria-hidden="true"></canvas>
<div id="hud" class="hud" hidden><span id="letter" class="badge"></span><span id="progress" class="badge" role="status">0/15</span></div>
<div class="card" id="leftCard"><canvas width="200" height="200" role="img"></canvas></div>
<div class="card right" id="rightCard"><canvas width="200" height="200" role="img"></canvas></div>
<div id="start" class="panel"><p>Выбери звук</p><div class="mode-row"><button class="action" data-mode="Р">Р</button><button class="action" data-mode="Л">Л</button></div></div>
<div id="turns" class="panel" hidden><button class="action" id="left" aria-label="Повернуть налево">←</button><button class="action right" id="right" aria-label="Повернуть направо">→</button></div>
<div id="deadEnd" class="panel" hidden><button id="undo" class="action" aria-label="Вернуться к развилке">↩</button></div>
<div id="finish" class="panel" hidden><p role="status">Молодец!</p><button id="again" class="action">Ещё раз</button></div>
</main>

    for(let i=-10;i<=10;i++){
      const x=i*86,y=Math.sin(i*.4)*27;
      stroke([{x,y},{x:x+26,y:y-2}],"#c2e4db",1.5);
    }
    ctx.restore();
  }
}
function drawBarrier(fork){
  const point=fork.barrier;
  ctx.save();ctx.translate(point.x,point.y);ctx.rotate(point.heading);
  for(const x of [-29,29]) rect(x-3,-10,6,25,2,"#635949");
  rect(-37,-8,74,15,3,"#fff2d5");
  ctx.save();ctx.beginPath();ctx.roundRect(-37,-8,74,15,3);ctx.clip();
  for(let x=-42;x<45;x+=20){
    ctx.fillStyle="#dc6754";ctx.beginPath();ctx.moveTo(x,-8);ctx.lineTo(x+10,-8);ctx.lineTo(x+19,7);ctx.lineTo(x+9,7);ctx.fill();
  }
  ctx.restore();
  rect(42,-38,4,51,1,"#6d654f");
  rect(24,-63,40,37,4,"#fff6d9");rect(27,-60,34,31,3,"#477da5");
  rect(41,-47,6,13,1,"#fff6d9");rect(35,-52,18,6,1,"#e96756");
  ctx.font="bold 10px sans-serif";ctx.textAlign="center";ctx.fillStyle="#314b53";ctx.fillText("Тупик",44,-18);
  ctx.restore();
}
function drawGarage(){
  ctx.save();ctx.translate(garageX,garageY);
  ellipse(10,15,104,33,"#58774738");
  sprite(ctx,scenery,3,7,-101,-167,202,202);
  if(door>0){
    const left=-54, top=-58, w=108, h=79;
    rect(left,top,w,h,2,"#3b4640");
    ctx.save();ctx.beginPath();ctx.rect(left,top,w,h);ctx.clip();
    const tw=scenery.naturalWidth/3, th=scenery.naturalHeight/3;
    ctx.drawImage(scenery,tw*1.232,th*2.534,tw*.535,th*.391,left,top-door*h,w,h);
    ctx.restore();
  }
  ctx.restore();
}
function drawCar(){
  if(phase==="closing"||phase==="finished") return;
  ctx.save();ctx.translate(car.x,car.y);ctx.rotate(car.angle);
  if(phase==="driving" && stage===roundCount && car.y<garageY+14 && Math.abs(car.x-garageX)<25){
    ctx.globalAlpha=clamp((car.y-garageY+28)/42);
  }
  ellipse(1,4,22,31,"#29332f44");
  for(const x of [-22,17]) for(const y of [-16,15]){
    rect(x,y-6,5,12,2,"#33352e");
    rect(x,y-5+(wheel%5),5,1.2,0,"#687069");
  }
  sprite(ctx,atlas,5,24,-36,-37,72,74);
  ctx.restore();
}
function render(){
  ctx.setTransform(ratio,0,0,ratio,0,0);
  const anchor=height*.67;
  ctx.translate(width/2,anchor);ctx.scale(scale,scale);ctx.translate(-camera.x,-camera.y);
  const top=camera.y-anchor/scale,bottom=camera.y+(height-anchor)/scale,half=width/(2*scale);
  drawTerrain(top,bottom,half);
  const visible=route.filter((_,i)=>section(i)>=top-100&&section(i)-stride<=bottom+100);
  const paths=visible.flatMap((fork)=>[fork.good,fork.deadRoad]);
  if(bottom>-70) paths.push(entry);
  if(top<destination+100) paths.push(join(approach,driveway));
  ctx.lineCap="round";ctx.lineJoin="round";
  for(const [color,w] of [["#64804c55",96],["#e8ce97",87],["#fbdfad",77],["#686f70",65],["#777d7e",59]]){
    paths.forEach((points)=>stroke(points,color,w));
  }
  paths.forEach((points)=>stroke(points,"#ffefcf",2,[14,13]));
  const bridgeY=-6*stride+123;
  if(top<bridgeY+90&&bottom>bridgeY-90){
    const bridgePath=route[5].good.filter(({y})=>Math.abs(y-bridgeY)<56);
    if(bridgePath.length>1){
      const mid=bridgePath[Math.floor(bridgePath.length/2)];
      ctx.save();ctx.translate(mid.x,mid.y);
      const a=bridgePath[0],b=bridgePath.at(-1);
      ctx.rotate(Math.atan2(b.x-a.x,a.y-b.y));
      for(const x of [-44,38]){
        rect(x,-61,6,122,2,"#b48450");
        for(let y=-58;y<60;y+=23) rect(x-2,y,10,7,2,"#785b43");
      }
      ctx.restore();
    }
  }
  for(const item of decorations){
    if(item.y<top-150||item.y>bottom+150||Math.abs(item.x-camera.x)>half+150) continue;
    sprite(ctx,scenery,3,item.id,item.x-item.size/2,item.y-item.size/2,item.size,item.size);
  }
  visible.forEach(drawBarrier);
  if(top<garageY+155){
    sprite(ctx,scenery,3,6,-238,garageY-130,203,203);
    sprite(ctx,scenery,3,8,-235,garageY+55,157,157);
    drawGarage();
  }
  drawCar();
  if(stage<roundCount){
    // Mist keeps the outcome of both turns out of view at the decision point.
    const near=camera.y-174, far=camera.y-258;
    if(top<near){
      const mist=ctx.createLinearGradient(0,far,0,near);
      const color=palettes[region(camera.y)][1];
      mist.addColorStop(0,color);
      mist.addColorStop(.31,color+"e8");
      mist.addColorStop(1,color+"00");
      ctx.fillStyle=mist;
      ctx.fillRect(camera.x-half-1,top,half*2+2,near-top);
    }
  }
  if(phase==="choice"){
    cardEls.forEach((card,i)=>{
      const side=i===0?-1:1;
      const x=width/2+(side*225-camera.x)*scale;
      const y=anchor+(section(stage)-151-camera.y)*scale;
      card.style.left=Math.max(card.offsetWidth/2+8,Math.min(width-card.offsetWidth/2-8,x))+"px";
      card.style.top=Math.max(card.offsetHeight/2+10,y)+"px";
    });
  }
}
function tick(now){
  const dt=Math.min(48,now-lastFrame||16);
  lastFrame=now;
  if(drive){
    const active=drive, t=clamp((now-active.start)/active.duration);
    const length=active.path.at(-1).length;
    // Ease the ends while leaving enough time to see each turn.
    const travel=t<.16 ? t*t/.32 : t>.84 ? .84-(1-t)*(1-t)/.32 : t-.08;
    const fraction=t===1?1:travel/.84;
    const distance=(active.reverse?1-fraction:fraction)*length;
    pose(active.path,distance);
    wheel+=Math.abs(distance-active.last);
    active.last=distance;
    if(t===1){drive=null;active.done();}
  }else if(phase==="opening"){
    door=smooth(clamp((now-doorStart)/930));
    if(door===1) play(inside,59,()=>{phase="closing";doorStart=performance.now();});
  }else if(phase==="closing"){
    door=1-smooth(clamp((now-doorStart)/900));
    if(door===0){phase="finished";$("finish").hidden=false;}
  }
  const follow=1-Math.exp(-dt/135);
  camera.x+=(car.x-camera.x)*follow;
  camera.y+=(car.y-camera.y)*follow;
  render();
  requestAnimationFrame(tick);
}
turnButtons.forEach((button,i)=>button.addEventListener("click",()=>turn(i===0?-1:1)));
document.querySelectorAll("[data-mode]").forEach((button)=>button.addEventListener("click",()=>begin(button.dataset.mode)));
$("undo").addEventListener("click",undo);
$("again").addEventListener("click",restart);
document.addEventListener("keydown",(event)=>{
  if(event.repeat) return;
  if(phase==="choice" && ["ArrowLeft","ArrowRight"].includes(event.key)){
    event.preventDefault();turn(event.key==="ArrowLeft"?-1:1);
  }
});
new ResizeObserver(resize).observe(canvas);
setup();
resize();
requestAnimationFrame(tick);
</script>
</body>
